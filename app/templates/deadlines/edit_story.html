{% extends "base.html" %}
{% block title %}{{ _('Edit Story') }}{% endblock %}

{% block content %}
<div class="px-4 sm:px-6 lg:px-8">
  <div class="max-w-3xl mx-auto">
    <div class="mb-6">
      <h2 class="text-2xl font-bold flex items-center gap-2">
        <span class="w-9 h-9 rounded-lg bg-primary flex items-center justify-center text-white"><i class="fas fa-edit"></i></span>
        {{ _('Edit Story') }}
      </h2>
      <p class="text-text-muted-light dark:text-text-muted-dark">{{ story.epic.name if story.epic else '' }}</p>
    </div>

    <div class="bg-card-light dark:bg-card-dark rounded-xl shadow ring-1 ring-border-light/60 dark:ring-border-dark/60">
      <div class="p-6">
        <form method="POST" action="{{ url_for('deadlines.edit_story', story_id=story.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-4">
            <label for="name" class="block text-sm font-medium mb-1">{{ _('Story Name') }} <span class="text-red-600">*</span></label>
            <input type="text" id="name" name="name" required value="{{ story.name }}" class="w-full rounded-lg border border-border-light dark:border-border-dark bg-background-light dark:bg-gray-700 px-3 py-2">
          </div>

          <div class="mb-4">
            <label for="description" class="block text-sm font-medium mb-1">{{ _('Description') }}</label>
            <textarea id="description" name="description" rows="3" class="w-full rounded-lg border border-border-light dark:border-border-dark bg-background-light dark:bg-gray-700 px-3 py-2">{{ story.description or '' }}</textarea>
          </div>

          <div class="mb-6">
            <label for="status" class="block text-sm font-medium mb-1">{{ _('Status') }}</label>
            <select id="status" name="status" class="w-full rounded-lg border border-border-light dark:border-border-dark bg-background-light dark:bg-gray-700 px-3 py-2">
              <option value="open" {% if story.status == 'open' %}selected{% endif %}>{{ _('Open') }}</option>
              <option value="done" {% if story.status == 'done' %}selected{% endif %}>{{ _('Done') }}</option>
            </select>
            <p class="mt-1 text-xs text-text-muted-light dark:text-text-muted-dark">{{ _('Only open stories appear in the Check-In dropdown') }}</p>
          </div>

          <div class="flex justify-end gap-3">
            <a href="{{ url_for('deadlines.view_epic', epic_id=story.epic_id) }}" class="px-4 py-2 rounded-lg border border-border-light dark:border-border-dark">{{ _('Cancel') }}</a>
            <button type="submit" class="px-4 py-2 rounded-lg bg-primary text-white hover:opacity-90">{{ _('Save Changes') }}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
