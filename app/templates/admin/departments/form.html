{% extends "base.html" %}
{% block title %}{{ _('Edit Department') if department else _('Add Department') }}{% endblock %}

{% block content %}
<div class="px-4 sm:px-6 lg:px-8">
  <div class="max-w-lg mx-auto">
    <div class="mb-6">
      <h2 class="text-2xl font-bold flex items-center gap-2">
        <span class="w-9 h-9 rounded-lg bg-primary flex items-center justify-center text-white"><i class="fas fa-sitemap"></i></span>
        {{ _('Edit Department') if department else _('Add Department') }}
      </h2>
    </div>

    <div class="bg-card-light dark:bg-card-dark rounded-xl shadow ring-1 ring-border-light/60 dark:ring-border-dark/60 p-6">
      <form method="POST" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
          <label for="name" class="form-label">{{ _('Name') }} *</label>
          <input type="text" id="name" name="name" required class="form-input w-full" value="{{ department.name if department else '' }}" placeholder="{{ _('e.g. OOP') }}">
        </div>
        <div>
          <label for="code" class="form-label">{{ _('Short code (optional)') }}</label>
          <input type="text" id="code" name="code" class="form-input w-full" value="{{ department.code if department else '' }}" placeholder="{{ _('e.g. OOP') }}">
        </div>
        <div>
          <label for="description" class="form-label">{{ _('Description (optional)') }}</label>
          <textarea id="description" name="description" rows="3" class="form-input w-full">{{ department.description if department else '' }}</textarea>
        </div>
        {% if department %}
        <div class="flex items-center gap-2">
          <input type="checkbox" id="is_active" name="is_active" {% if department.is_active %}checked{% endif %} class="rounded">
          <label for="is_active" class="text-sm">{{ _('Active') }}</label>
        </div>
        {% endif %}
        <div class="flex justify-end gap-3 pt-2">
          <a href="{{ url_for('admin.list_departments') }}" class="px-4 py-2 rounded-lg border border-border-light dark:border-border-dark">{{ _('Cancel') }}</a>
          <button type="submit" class="px-4 py-2 rounded-lg bg-primary text-white hover:opacity-90">{{ _('Save') }}</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
