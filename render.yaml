# Render Blueprint: NDSTracker Web Service + PostgreSQL
# Builds the Docker image directly from this repo's Dockerfile on every deploy
# (this fork's own customizations -- branding, Jira widget, chat, etc. -- not
# the upstream drytrix/timetracker image).

databases:
  - name: timetracker-db
    databaseName: timetracker
    user: timetracker
    plan: free

services:
  - type: web
    name: ndstracker
    runtime: docker
    region: oregon
    branch: Ican
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Same as docker-compose: image default CMD runs python /app/start.py (DB wait, migrate, seed, gunicorn). start.py binds to PORT when set.
    healthCheckPath: /_health

    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app:create_app()
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: timetracker-db
          property: connectionString
      - key: AUTH_METHOD
        value: local
      - key: REDIS_ENABLED
        value: "false"
      # Lets testers create their own accounts (register on the login page)
      # instead of you creating one for each person.
      - key: ALLOW_SELF_REGISTER
        value: "true"
      # Comma-separated usernames that get admin rights automatically on
      # registration. Register with this exact username to get admin access.
      - key: ADMIN_USERNAMES
        value: admin123
      # Demo mode: uncomment below and set DEMO_PASSWORD in Render Dashboard for a single-user demo
      # - key: DEMO_MODE
      #   value: "true"
      # - key: DEMO_USERNAME
      #   value: demo
      # - key: DEMO_PASSWORD
      #   sync: false
